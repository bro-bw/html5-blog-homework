<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HTML5 学习笔记，介绍 HTML5 简介与语义化标签。">
  <title>技术博客 - HTML5 学习笔记</title>
  <style>
    :root { --primary: #1769c2; --accent: #008eaa; --text: #233140; --muted: #5e6f80; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif; color: var(--text); background: linear-gradient(160deg, #f0f6fd, #dbe9fa); line-height: 1.8; }
    .site-header { padding: 42px 20px; text-align: center; color: #fff; background: linear-gradient(135deg, var(--primary), #00b4d8); }
    .site-header h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: .2em; text-shadow: 0 2px 6px rgb(0 0 0 / 25%); }
    .nav { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; padding: 12px 24px; background: #fff; box-shadow: 0 2px 10px rgb(43 125 224 / 12%); }
    .nav a { padding: 4px 14px; border-radius: 18px; color: var(--primary); font-weight: 600; text-decoration: none; }
    .nav a:hover, .nav a:focus-visible { color: #fff; background: var(--primary); outline: none; }
    main { width: min(100% - 40px, 720px); margin: 42px auto; display: grid; gap: 24px; }
    .card { padding: clamp(22px, 5vw, 36px); background: #fff; border-radius: 14px; box-shadow: 0 12px 32px rgb(43 125 224 / 15%); }
    h2 { margin: 0 0 18px; padding-left: 12px; border-left: 4px solid var(--primary); font-size: 1.2rem; }
    .toc { margin: 0 0 18px; padding: 14px 18px; background: #f5f9ff; border-radius: 8px; }
    .toc a { color: var(--primary); font-weight: 600; }
    .article-body h3 { margin-top: 24px; }
    .article-body img { display: block; width: min(100%, 150px); height: auto; margin: 16px auto; border: 1px solid #e2ebf5; border-radius: 8px; }
    .field { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #d3dce6; border-radius: 8px; font: inherit; }
    textarea { min-height: 96px; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--primary); outline: 3px solid rgb(43 125 224 / 15%); }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--accent)); font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { opacity: .9; }
    footer { padding: 22px; color: var(--muted); text-align: center; font-size: .875rem; }
  </style>
</head>
<body>
  <header class="site-header"><h1>技术博客</h1></header>
  <nav class="nav" aria-label="主导航"><a href="#home">首页</a><a href="#about">关于我们</a><a href="#contact">联系我们</a></nav>
  <main id="home">
    <article class="card">
      <h2>HTML5 学习笔记</h2>
      <nav class="toc" aria-label="文章目录">目录：<br><a href="#item1">一、HTML5 简介</a><br><a href="#item2">二、语义化标签</a></nav>
      <div class="article-body">
        <p>本笔记介绍 HTML5 的核心特性，适合初学者快速入门。</p>
        <img src="assets/images/html5-logo.png" alt="HTML5 标志">
        <h3 id="item1">一、HTML5 简介</h3>
        <p>HTML5 是新一代网页标准，支持多媒体、绘图与语义化等丰富特性。</p>
        <h3 id="item2">二、语义化标签</h3>
        <p>在编写网页时，应尽量使用语义化标签，让结构更清晰、更利于搜索引擎理解内容。</p>
      </div>
    </article>
    <section class="card" id="contact" aria-labelledby="comment-title">
      <h2 id="comment-title">发表评论</h2>
      <form class="comment-form" action="#" method="post">
        <div class="field"><label for="nickname">昵称</label><input id="nickname" name="nickname" type="text" autocomplete="nickname" required></div>
        <div class="field"><label for="comment">评论</label><textarea id="comment" name="comment" required></textarea></div>
        <button type="submit">提交评论</button>
      </form>
    </section>
  </main>
  <footer id="about">版权所有 © 2026 某某公司</footer>
</body>
</html>
